<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫剧制作平台入口已迁移</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f8f8fa;
        color: #18181b;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, .08);
      }
      h1 { margin: 0 0 12px; font-size: 22px; }
      p { margin: 0 0 16px; color: #52525b; line-height: 1.7; }
      code {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 4px;
        background: #f4f4f5;
        color: #27272a;
      }
      a {
        color: #4f46e5;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正式入口已迁移到 Vue 工程</h1>
      <p>根目录旧原型页面已停用。请启动后端服务后访问 <a href="/canvas">/canvas</a>，或在 <code>aicp-frontend</code> 中运行 <code>npm run dev</code> 后访问 Vite 开发服务。</p>
      <p>后端静态资源由 <code>aicp-frontend</code> 构建输出到 <code>aicp-backend/src/main/resources/static</code>。</p>
    </main>
  </body>
</html>
