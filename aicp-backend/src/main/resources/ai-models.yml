# AICP AI 模型注册表
# 所有 AI 调用通过 new-api 网关，此处定义模型映射、定价和降级链

models:
  text:
    - id: deepseek-v3
      provider: deepseek
      new-api-model: deepseek-chat
      cost_per_1k_tokens: 0.001
      max_tokens: 128000
      priority: 1
    - id: gpt-4o
      provider: openai
      new-api-model: gpt-4o
      cost_per_1k_tokens: 0.005
      max_tokens: 128000
      priority: 2
    - id: claude-sonnet-4
      provider: anthropic
      new-api-model: claude-sonnet-4-20250514
      cost_per_1k_tokens: 0.003
      max_tokens: 200000
      priority: 3

  image:
    - id: seedream-5.0
      provider: bytedance
      new-api-model: seedream-5.0
      cost_per_image: 10
      supported_sizes: ["1080x1920", "1920x1080", "1024x1024"]
      priority: 1
    - id: flux-1.1-pro
      provider: black-forest
      new-api-model: flux-1.1-pro
      cost_per_image: 8
      priority: 2

  video:
    - id: seedance-2.0
      provider: bytedance
      new-api-model: seedance-2.0
      cost_per_second: 50
      max_duration: 10
      priority: 1
    - id: kling-1.6
      provider: kuaishou
      new-api-model: kling-1.6
      cost_per_second: 40
      max_duration: 10
      priority: 2

  audio:
    - id: volcano-tts
      provider: bytedance
      new-api-model: volcano-tts
      cost_per_char: 1
      priority: 1
